<div class="page-container">
  <div class="page-header">
    <div>
      <h1>Contato</h1>
      <p>Dúvidas, sugestões ou reclamações? Fale com a administração.</p>
    </div>
  </div>

  <form [formGroup]="form" (ngSubmit)="send()" class="contact-form">
    <div class="form-section">
      <div class="form-row">
        <div class="form-group">
          <label>Nome *</label>
          <input type="text" formControlName="name" placeholder="Seu nome" />
          <span class="field-error" *ngIf="form.get('name')?.touched && form.get('name')?.invalid">
            Informe seu nome (mínimo 2 caracteres).
          </span>
        </div>
        <div class="form-group">
          <label>E-mail *</label>
          <input type="email" formControlName="email" placeholder="seu@email.com" />
          <span class="field-error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
            E-mail inválido.
          </span>
        </div>
      </div>

      <div class="form-group">
        <label>Assunto</label>
        <input type="text" formControlName="subject" placeholder="Assunto (opcional)" />
      </div>

      <div class="form-group">
        <label>Mensagem *</label>
        <textarea formControlName="message" rows="5"
          placeholder="Escreva sua mensagem..."></textarea>
        <span class="field-error" *ngIf="form.get('message')?.touched && form.get('message')?.invalid">
          A mensagem deve ter ao menos 10 caracteres.
        </span>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Enviando...' : 'Enviar mensagem' }}
      </button>
    </div>
  </form>
</div>
