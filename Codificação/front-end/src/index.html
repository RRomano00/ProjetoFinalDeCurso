<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Fala Cidade</title>
  <base href="/">
  <!-- O teclado encolhe a tela inteira em vez de sobrepor e deslocar a página; evita o salto da barra de baixo ao fechá-lo. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="theme-color" content="#14487e">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    window.addEventListener('beforeinstallprompt', function (evento) {
      evento.preventDefault();
      window.__instalarPrompt = evento;
    });
    window.addEventListener('appinstalled', function () { window.__instalarPrompt = null; });
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
